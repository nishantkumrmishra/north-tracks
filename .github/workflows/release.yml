name: Build Standalone Windows Executable

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone EXE
        run: |
          pyinstaller --onefile --name "NorthTracks" --icon assets/icon.ico --clean app.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthTracks-Windows-x64
          path: dist/NorthTracks.exe

      - name: Attach EXE to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NorthTracks.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
