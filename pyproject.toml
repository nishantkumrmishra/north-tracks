[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "northtracks"
version = "1.0.1"
description = "North Tracks - Autonomous 320k Studio Audio Downloader & Organizer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Nishant Kumar Mishra"}
]
keywords = ["music", "downloader", "320kbps", "spotify", "jiosaavn", "audio", "itunes"]
dependencies = [
    "requests>=2.31.0",
    "mutagen>=1.47.0",
    "pycryptodome>=3.20.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43"
]

[project.urls]
Homepage = "https://github.com/nishantkumrmishra/north-tracks"
Repository = "https://github.com/nishantkumrmishra/north-tracks"
Issues = "https://github.com/nishantkumrmishra/north-tracks/issues"

[project.scripts]
northtracks = "musicdl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["musicdl*"]
